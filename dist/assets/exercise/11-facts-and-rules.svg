<text x="70" y="131" fill="#142c3e" font-size="37" font-weight="700" text-anchor="start"><tspan x="70" dy="0">Facts are not the same as rules</tspan></text><text x="70" y="171" fill="#526878" font-size="21" font-weight="400" text-anchor="start"><tspan x="70" dy="0">A small demonstration knowledge base with three possible objects.</tspan></text>
<rect x="70" y="224" width="550" height="423" rx="16" fill="#f4faf9" stroke="#ccdae3" stroke-width="2"/><rect x="655" y="224" width="550" height="423" rx="16" fill="#f4f7fd" stroke="#ccdae3" stroke-width="2"/><text x="94" y="266" fill="#087f83" font-size="27" font-weight="600" text-anchor="start"><tspan x="94" dy="0">1. ______________</tspan></text><text x="678" y="266" fill="#2859bd" font-size="27" font-weight="600" text-anchor="start"><tspan x="678" dy="0">2. ______________</tspan></text><text x="95" y="319" fill="#526878" font-size="21" font-weight="600" text-anchor="start"><tspan x="95" dy="0">Object</tspan></text><text x="300" y="319" fill="#526878" font-size="21" font-weight="600" text-anchor="start"><tspan x="300" dy="0">Surface</tspan></text><text x="452" y="319" fill="#526878" font-size="21" font-weight="600" text-anchor="start"><tspan x="452" dy="0">Power</tspan></text><path d="M94 405 H593" stroke="#ccdae3"/><text x="95" y="382" fill="#142c3e" font-size="22" font-weight="400" text-anchor="start"><tspan x="95" dy="0">Tram</tspan></text><text x="300" y="382" fill="#142c3e" font-size="22" font-weight="400" text-anchor="start"><tspan x="300" dy="0">Rails</tspan></text><text x="452" y="382" fill="#142c3e" font-size="22" font-weight="400" text-anchor="start"><tspan x="452" dy="0">Electric</tspan></text><path d="M94 485 H593" stroke="#ccdae3"/><text x="95" y="462" fill="#142c3e" font-size="22" font-weight="400" text-anchor="start"><tspan x="95" dy="0">Bicycle</tspan></text><text x="300" y="462" fill="#142c3e" font-size="22" font-weight="400" text-anchor="start"><tspan x="300" dy="0">Road</tspan></text><text x="452" y="462" fill="#142c3e" font-size="22" font-weight="400" text-anchor="start"><tspan x="452" dy="0">Pedals</tspan></text><path d="M94 565 H593" stroke="#ccdae3"/><text x="95" y="542" fill="#142c3e" font-size="22" font-weight="400" text-anchor="start"><tspan x="95" dy="0">Electric car</tspan></text><text x="300" y="542" fill="#142c3e" font-size="22" font-weight="400" text-anchor="start"><tspan x="300" dy="0">Road</tspan></text><text x="452" y="542" fill="#142c3e" font-size="22" font-weight="400" text-anchor="start"><tspan x="452" dy="0">Electric</tspan></text><text x="681" y="335" fill="#142c3e" font-size="21" font-weight="400" text-anchor="start"><tspan x="681" dy="0">IF surface = rails</tspan><tspan x="681" dy="30">THEN ____________________</tspan></text><text x="681" y="436" fill="#142c3e" font-size="21" font-weight="400" text-anchor="start"><tspan x="681" dy="0">IF surface = road AND power = pedals</tspan><tspan x="681" dy="30">THEN ____________________</tspan></text><text x="681" y="537" fill="#142c3e" font-size="21" font-weight="400" text-anchor="start"><tspan x="681" dy="0">IF surface = road AND power = electric</tspan><tspan x="681" dy="30">THEN ____________________</tspan></text>
