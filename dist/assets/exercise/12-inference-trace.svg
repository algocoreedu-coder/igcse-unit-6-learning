<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Trace an expert-system conclusion — Recall practice</title><desc id="desc">Explain which rule matches the facts, not only the final answer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f83"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10z" fill="#087f83"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="800" fill="#fff"/>
<rect x="36" y="30" width="1208" height="740" rx="22" fill="#fff" stroke="#e2eaf0" stroke-width="2"/>
<text x="70" y="78" fill="#087f83" font-size="19" font-weight="600" text-anchor="start"><tspan x="70" dy="0">UNIT 6  /  VISUAL 12  /  RECALL &amp; EXPLAIN</tspan></text>
<text x="70" y="131" fill="#142c3e" font-size="37" font-weight="700" text-anchor="start"><tspan x="70" dy="0">Trace an expert-system conclusion</tspan></text><text x="70" y="171" fill="#526878" font-size="21" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Use the facts and rules from the previous visual.</tspan></text>
<rect x="80" y="260" width="320" height="173" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="80" y="260" width="6" height="173" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="102" y="299" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="102" dy="0">1. ______________</tspan></text><text x="102" y="342" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="102" dy="0">Surface = road</tspan><tspan x="102" dy="29">Power = pedals</tspan></text><rect x="485" y="260" width="320" height="173" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="485" y="260" width="6" height="173" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="507" y="299" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="507" dy="0">2. ______________</tspan></text><text x="507" y="342" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="507" dy="0">IF road AND pedals</tspan><tspan x="507" dy="29">THEN bicycle</tspan></text><rect x="890" y="260" width="300" height="173" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="890" y="260" width="6" height="173" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="912" y="299" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="912" dy="0">3. ______________</tspan></text><text x="912" y="342" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="912" dy="0">________________</tspan></text><path d="M400 345 H475" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><path d="M805 345 H880" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="220" y="521" width="840" height="113" rx="16" fill="#f4f7fd" stroke="#ccdae3" stroke-width="2"/><text x="640" y="563" fill="#142c3e" font-size="25" font-weight="500" text-anchor="middle"><tspan x="640" dy="0">What if the user answers “road” and “electric”?</tspan></text><text x="640" y="604" fill="#526878" font-size="22" font-weight="400" text-anchor="middle"><tspan x="640" dy="0">Predict the result, then point to the rule that supports it.</tspan></text>
<path d="M70 709 H1210" stroke="#ccdae3"/><text x="70" y="746" fill="#526878" font-size="20" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Explain which rule matches the facts, not only the final answer.</tspan></text>
</g></svg>