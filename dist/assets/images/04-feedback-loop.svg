<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Automated control: the feedback loop — Teaching visual</title><desc id="desc">Follow the data, decision, action and changed environment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f83"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10z" fill="#087f83"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="800" fill="#fff"/>
<rect x="36" y="30" width="1208" height="740" rx="22" fill="#fff" stroke="#e2eaf0" stroke-width="2"/>
<text x="70" y="78" fill="#087f83" font-size="19" font-weight="600" text-anchor="start"><tspan x="70" dy="0">UNIT 6  /  VISUAL 04  /  LEARN &amp; EXPLAIN</tspan></text>
<text x="70" y="131" fill="#142c3e" font-size="37" font-weight="700" text-anchor="start"><tspan x="70" dy="0">Automated control: the feedback loop</tspan></text><text x="70" y="171" fill="#526878" font-size="21" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Follow the data, decision, action and changed environment.</tspan></text>
<rect x="80" y="267" width="300" height="150" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="80" y="267" width="6" height="150" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="102" y="306" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="102" dy="0">Sensor</tspan></text><text x="102" y="349" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="102" dy="0">Measures temperature</tspan><tspan x="102" dy="29">Sends a reading</tspan></text><rect x="490" y="267" width="300" height="150" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="490" y="267" width="6" height="150" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="512" y="306" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="512" dy="0">Microprocessor</tspan></text><text x="512" y="349" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="512" dy="0">Compares with threshold</tspan><tspan x="512" dy="29">Decides what to do</tspan></text><rect x="900" y="267" width="300" height="150" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="900" y="267" width="6" height="150" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="922" y="306" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="922" dy="0">Actuator</tspan></text><text x="922" y="349" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="922" dy="0">Motor drives the fan</tspan><tspan x="922" dy="29">Changes the conditions</tspan></text><path d="M380 340 H480" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 340 H890" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="309" fill="#526878" font-size="20" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">data</tspan></text><text x="840" y="309" fill="#526878" font-size="20" font-weight="400" text-anchor="middle"><tspan x="840" dy="0">signal</tspan></text><rect x="450" y="535" width="380" height="110" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="450" y="535" width="6" height="110" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="472" y="574" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="472" dy="0">Environment</tspan></text><text x="472" y="617" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="472" dy="0">Temperature changes</tspan></text><path d="M1050 417 V590 H840" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 590 H230 V427" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="500" fill="#526878" font-size="21" font-weight="400" text-anchor="start"><tspan x="300" dy="0">Read the conditions again</tspan></text>
<path d="M70 709 H1210" stroke="#ccdae3"/><text x="70" y="746" fill="#526878" font-size="20" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Why must the sensor take another reading?</tspan></text>
</g></svg>