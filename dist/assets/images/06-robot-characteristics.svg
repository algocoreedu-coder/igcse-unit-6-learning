<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">What makes a robot? — Teaching visual</title><desc id="desc">Connect each characteristic to a real component or action.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087f83"/></marker><marker id="start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10z" fill="#087f83"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1280" height="800" fill="#fff"/>
<rect x="36" y="30" width="1208" height="740" rx="22" fill="#fff" stroke="#e2eaf0" stroke-width="2"/>
<text x="70" y="78" fill="#087f83" font-size="19" font-weight="600" text-anchor="start"><tspan x="70" dy="0">UNIT 6  /  VISUAL 06  /  LEARN &amp; EXPLAIN</tspan></text>
<text x="70" y="131" fill="#142c3e" font-size="37" font-weight="700" text-anchor="start"><tspan x="70" dy="0">What makes a robot?</tspan></text><text x="70" y="171" fill="#526878" font-size="21" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Connect each characteristic to a real component or action.</tspan></text>
<rect x="430" y="222" width="420" height="92" rx="16" fill="#142c3e" stroke="#142c3e" stroke-width="2"/><text x="640" y="278" fill="#fff" font-size="30" font-weight="600" text-anchor="middle"><tspan x="640" dy="0">INDUSTRIAL ROBOT</tspan></text><path d="M520 314 V362 H250 V407" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 314 V407" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 314 V362 H1030 V407" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="417" width="300" height="195" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="80" y="417" width="6" height="195" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="102" y="456" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="102" dy="0">Mechanical structure</tspan></text><text x="102" y="499" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="102" dy="0">Frame, joints and gripper</tspan><tspan x="102" dy="29">Support and movement</tspan></text><rect x="490" y="417" width="300" height="195" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="490" y="417" width="6" height="195" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="512" y="456" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="512" dy="0">Electrical components</tspan></text><text x="512" y="499" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="512" dy="0">Sensors, motors, controller</tspan><tspan x="512" dy="29">Sensing and actuation</tspan></text><rect x="900" y="417" width="300" height="195" rx="16" fill="#f3f9fa" stroke="#ccdae3" stroke-width="2"/><rect x="900" y="417" width="6" height="195" rx="3" fill="#087f83" stroke="#087f83" stroke-width="2"/><text x="922" y="456" fill="#087f83" font-size="22" font-weight="600" text-anchor="start"><tspan x="922" dy="0">Programmable</tspan></text><text x="922" y="499" fill="#142c3e" font-size="20" font-weight="400" text-anchor="start"><tspan x="922" dy="0">Instructions in the controller</tspan><tspan x="922" dy="29">Determine the actions</tspan></text>
<path d="M70 709 H1210" stroke="#ccdae3"/><text x="70" y="746" fill="#526878" font-size="20" font-weight="400" text-anchor="start"><tspan x="70" dy="0">Which part of the robot is programmable?</tspan></text>
</g></svg>